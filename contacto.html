<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Andjelica Verneant</title>

    <!-- Vinculación de estilos CSS compartidos -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tipografía Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Librería de animaciones AOS (Animate On Scroll) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>

    <!-- TARJETA PRINCIPAL (CARD) -->
    <main class="card card-contact" data-aos="fade-up" data-aos-duration="700">

        <!-- 1. MENÚ DE NAVEGACIÓN SUPERIOR -->
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>

        <!-- 2. ENCABEZADO DE LA SECCIÓN DE CONTACTO -->
        <header class="contact-header" data-aos="fade-down" data-aos-delay="200">
            <h1 class="contact-title">Contacto</h1>
            <div class="accent-line contact-accent-line"></div>
            <p class="contact-subtitle">Tu marca tiene una historia que contar.<br><strong>¡Hagamos que el mundo quiera escucharla!</strong></p>
        </header>

        <!-- 3. FORMULARIO DE CONTACTO -->
        <form action="#" method="POST" class="contact-form" data-aos="zoom-in" data-aos-delay="300">
            <div class="form-group">
                <label for="username">Nombre Completo:</label>
                <input type="text" id="username" name="username" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>

        <!-- 4. PIE DE PÁGINA / FOOTER SEMÁNTICO -->
        <footer class="card-footer">
            <p>&copy; 2026 Andjelica Verneant. Todos los derechos reservados.</p>
        </footer>

    </main>

    <!-- Librería AOS para animaciones dinámicas -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>
</body>

</html>
